<script>
(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory;else root.SECompose=factory;})(this,function(SEED,st){'use strict';var VAR={white:{vi:'Trắng',en:'White',hex:'#F7F4EE'},blue:{vi:'Xanh',en:'Blue',hex:'#A9BCD0'},cream:{vi:'Kem',en:'Cream',hex:'#EDE3CF'},black:{vi:'Đen',en:'Black',hex:'#1E1B1A'},taupe:{vi:'Taupe',en:'Taupe',hex:'#A8968A'},yellow:{vi:'Vàng',en:'Yellow',hex:'#EBD88C'}};var PL=SEED.products,PM={};PL.forEach(function(p){PM[p.id]=p;});var FL=SEED.flow.map(function(e){var o=Object.assign({},e);o.n=parseInt(e.stage,10)||1;return o;}),FM={};FL.forEach(function(e){FM[e.id]=e;});var nfV=new Intl.NumberFormat('vi-VN'),nfE=new Intl.NumberFormat('en-US');function ovs(){return st.ov||{};}
function pv(o,f){var x=ovs()[o.id];return x&&x[f]!==undefined ? x[f]:o[f];}
function clean(t){return String(t==null ? '':t).replace(/\r\n?/g,'\n').replace(/[ \t]+$/gm,'').replace(/\n{3,}/g,'\n\n').trim();}
function other(l){return l==='vi' ? 'en':'vi';}
function money(n,l){return l==='en' ? nfE.format(n)+ ' VND':nfV.format(n)+ 'đ';}
function moneyP(n,l){return l==='en' ? 'VND ' + nfE.format(n):nfV.format(n)+ 'đ';}
function colorOf(p){if(p.variant)return VAR[p.variant].vi;var m=/Màu:\s*([^\n]+)/.exec(pv(p,'descVi')||'');return m ? m[1].replace(/\.+$/,'').trim():'';}
function colorEn(p){if(p.variant)return VAR[p.variant].en;var m=/Colou?r:\s*([^\n]+)/i.exec(pv(p,'descEn')||'');return m ? m[1].replace(/\.+$/,'').trim():'';}
function pname(p,l){var n=pv(p,'name');return p.variant ? n + ' · ' + VAR[p.variant][l||'vi']:n;}
function pitem(p,l){var n=pv(p,'name');return p.variant ? n + ' (' + VAR[p.variant][l||'vi']+ ')':n;}
function psizes(p){var s=pv(p,'sizes');return Array.isArray(s)? s:['S','M'];}
function ptext(p,w,l){return pv(p,w +(l==='en' ? 'En':'Vi'))||'';}
function ptrunc(p,w,l){var k=w +(l==='en' ? 'En':'Vi');return(p.truncated||[]).indexOf(k)> -1&&!(ovs()[p.id]||{})[k];}
function normEn(t){if(/\n/.test(t))return t;return t.replace(/\s*\{\{orderLines\}\}\s*/,'\n{{orderLines}}\n').replace(/\s+Total:/,'\nTotal:').replace(/\s+Please use/,'\n\nPlease use');}

function entryText(e,l){var vi=pv(e,'vi')||'',en=pv(e,'en')||'';if(e.id==='order-recap')en=normEn(en);if(/\{\{itemInfo\}\}/.test(vi)&&en&&!/\{\{itemInfo\}\}/.test(en))en +='\n\n{{itemInfo}}';var t=l==='en' ? en:vi,fell=false;if(!t.trim()){var o=l==='en' ? vi:en;if(o.trim()){t=o;fell=true;}}
return{text:t,fell:fell,empty:!t.trim()};}

function calc(){var d=st.draft,sub=0,n=0;d.lines.forEach(function(L){var p=PM[L.pid];if(p){sub +=pv(p,'price')* L.qty;n +=L.qty;}});var ship=d.ship==='fee' ? st.set.fee:d.ship==='custom' ?(d.custom||0):0;return{sub:sub,ship:ship,total:sub + ship,count:d.lines.length,qty:n};}
function totalStr(l){return l==='en' ? nfE.format(calc().total):money(calc().total,'vi');}
function linesText(l){return st.draft.lines.map(function(L){var p=PM[L.pid];if(!p)return '';var nm=pv(p,'name')+(p.variant ? ' – ' + VAR[p.variant][l]:'');return '• ' + nm + ' – size ' + L.size +(L.qty > 1 ? ' x' + L.qty:'')+ ': ' + money(pv(p,'price')* L.qty,l);}).join('\n');}
function shipLine(l){var d=st.draft,vi=l==='vi';if(d.ship==='courier')return vi ? '• Shipping: khách trả shipper':'• Shipping — paid directly to the courier';if(d.ship==='free')return vi ? '• Shipping: miễn phí':'• Shipping — free';return '• Shipping: ' + money(d.ship==='fee' ? st.set.fee:d.custom||0,l);}
function orderText(l){var o=ovs().__ord||{};var t=o[l]!==undefined ? o[l]:SEED.orderTemplate[l];if(l==='en')t=normEn(t);t=t.replace(/^\s*•\s*Shipping.*$/m,function(){return shipLine(l);});t=t.replace('{{orderLines}}',function(){return linesText(l);}).replace('{{total}}',function(){return totalStr(l);});var d=st.draft;if(d.info.trim())t +='\n\n' +(l==='en' ? 'Ship to:':'Giao đến:')+ '\n' + d.info.trim();var b=st.set.bank;if(d.bank&&b.no)t +='\n\n' +(l==='en' ? 'Bank transfer: ':'Chuyển khoản: ')+[b.name,b.no,b.holder].filter(Boolean).join(' · ');return clean(t);}

function leadStore(){var s=st.lead;if(!s)s=st.lead={sel:{},custom:[],edits:{},hidden:[]};return s;}

function leadList(a,l){var s=leadStore(),out=[];s.custom.forEach(function(c){if(c.action===a){var t=(c[l]||'').trim();if(t)out.push({id:c.id,text:t,seed:false,def:false});}});((SEED.leadIns&&SEED.leadIns[a])||[]).forEach(function(x){if(s.hidden.indexOf(x.id)> -1)return;var e=s.edits[x.id]||{},t=((e[l]!==undefined ? e[l]:x[l])||'').trim();if(t)out.push({id:x.id,text:t,seed:true,def:!!x['default']});});return out;}

function leadSel(a,l){var k=a + ':' + l,s=leadStore();if(Object.prototype.hasOwnProperty.call(s.sel,k))return s.sel[k];var d=leadList(a,l).filter(function(x){return x.def;})[0];return d ? d.id:null;}
